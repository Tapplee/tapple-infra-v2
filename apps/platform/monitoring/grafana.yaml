# Grafana — 대시보드는 기존 infra/monitoring 것을 ConfigMap(sidecar)으로 로드
# datasource uid(prometheus/loki/tempo)는 대시보드 JSON이 참조하므로 로컬 스택과 동일하게 유지
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    # Greenfield라 chart v13의 distroless/read-only root filesystem 기본값을 적용한다.
    # appVersion 13.2.0은 13.0.x 이후 공개된 인증 전 DoS·XSS·정보 노출 수정을 포함한다.
    targetRevision: 13.0.1
    helm:
      valuesObject:
        fullnameOverride: grafana
        image:
          tag: 13.2.0-distroless
          sha: 08e6ab6d67a5e21e6540724d3673a572840a43b1ba02d03922d0a21a7dbb38f9
        # Secrets Manager /tapple/platform/monitoring/grafana-admin → ExternalSecret/grafana-admin
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        persistence:
          enabled: true
          storageClassName: local-path
          size: 1Gi
        # 단일 replica가 SQLite PVC를 공유하므로 upgrade 중 두 프로세스를 동시에 띄우지 않는다.
        deploymentStrategy:
          type: Recreate
        resources:
          requests: { cpu: 100m, memory: 384Mi }
          limits: { memory: 1Gi }
        # PVC ownership을 한 번 조정하는 chart 생성 init container의 자원 경계.
        initChownData:
          image:
            tag: "1.38.0"
            sha: dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
        testFramework:
          enabled: false
        # manifests/monitoring/dashboards/의 ConfigMap(label: grafana_dashboard=1)을 자동 로드
        sidecar:
          image:
            tag: 2.10.3
            sha: e8fb0c4fa3c5a22d9d0eabd9c13cf5df9ce65cba6a062272f2a762f7a78284d6
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            searchNamespace: monitoring
            resource: configmap
            # Admin API reload 대신 Grafana provider의 30초 file polling을 쓰면
            # sidecar에 admin Secret을 주입할 필요가 없다.
            skipReload: true
            provider:
              folder: tapple
        # chart 기본값은 sidecar에 모든 namespace의 Secret 조회권한까지 준다. 대시보드
        # ConfigMap만 읽는 namespace Role을 chart와 같은 release에서 만들고 여기에만 bind한다.
        rbac:
          namespaced: true
          useExistingRole: grafana-dashboard-reader
        extraObjects:
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: grafana-dashboard-reader
              namespace: monitoring
            rules:
              - apiGroups: [""]
                resources: ["configmaps"]
                verbs: ["get", "list", "watch"]
        datasources:
          datasources.yaml:
            apiVersion: 1
            # 로컬 provisioning에서 cloudwatch(AWS 떠남)만 제외
            datasources:
              - name: Alertmanager
                type: alertmanager
                uid: alertmanager
                access: proxy
                url: http://prometheus-alertmanager.monitoring.svc.cluster.local:9093
                jsonData:
                  implementation: prometheus
              - name: Prometheus
                type: prometheus
                uid: prometheus
                access: proxy
                url: http://prometheus-server.monitoring.svc.cluster.local:80
                isDefault: true
                jsonData:
                  timeInterval: 30s
              - name: Loki
                type: loki
                uid: loki
                access: proxy
                url: http://loki.monitoring.svc.cluster.local:3100
                jsonData:
                  derivedFields:
                    - datasourceUid: tempo
                      matcherRegex: '"traceId":"(\w+)"'
                      name: traceId
                      url: '$${__value.raw}'
              - name: Tempo
                type: tempo
                uid: tempo
                access: proxy
                # grafana/tempo 차트의 http_listen_port 기본값 3100 (로컬 3200과 다름)
                url: http://tempo.monitoring.svc.cluster.local:3100
                jsonData:
                  tracesToLogsV2:
                    datasourceUid: loki
                    filterByTraceID: true
                  tracesToMetrics:
                    datasourceUid: prometheus
                  serviceMap:
                    datasourceUid: prometheus
                  nodeGraph:
                    enabled: true
        # ---------- 외부 노출 ----------
        # Cloudflare Origin Certificate를 Traefik에서 종료하고 Cloudflare는 Full(strict)로 연결한다.
        # 인증서와 private key는 Secrets Manager → ESO → grafana-origin-tls로 공급한다.
        #
        # 남은 사람 작업:
        #   Cloudflare DNS →  grafana-k3s   A   <IDC_PUBLIC_IP>   [Proxied 🟠]
        #
        # 이름을 grafana 가 아니라 grafana-k3s 로 둔 이유: 와일드카드 때문에
        # grafana.tapple.co.kr 이 이미 홈서버로 응답한다(실측 HTTP 200). 겹치면 헷갈린다.
        #
        # 주의 — Cloudflare edge의 Universal SSL은 tapple.co.kr 과 *.tapple.co.kr 만 커버한다.
        # 2단(pr-27.api.tapple.co.kr)은 인증서가 안 맞는다. 앱·프리뷰를 실도메인으로 옮길 때는
        # pr-27-api.tapple.co.kr 처럼 1단으로 평평하게 잡아야 한다.
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            # Grafana host는 평문 web(:80) 라우터를 만들지 않는다.
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - grafana-k3s.tapple.co.kr
          tls:
            - secretName: grafana-origin-tls
              hosts:
                - grafana-k3s.tapple.co.kr

        env:
          # 링크와 secure cookie의 기준 주소. port-forward로 보면 일부 링크는 공개 주소를 가리킨다.
          GF_SERVER_ROOT_URL: https://grafana-k3s.tapple.co.kr

        grafana.ini:
          auth.basic:
            enabled: true
            password_policy: true
          auth.anonymous:
            enabled: false
          security:
            cookie_secure: true
            cookie_samesite: strict
            strict_transport_security: true
            strict_transport_security_max_age_seconds: "31536000"
          plugins:
            # distroless/read-only image에서 bundled plugin을 쓰기 갱신하지 않는다.
            # plugin update는 검증한 Grafana image/chart upgrade와 함께 한다.
            preinstall_auto_update: false
          users:
            # OAuth 이메일 자동 연결은 보안상 쓰지 않는다. 운영자가 로컬 계정을 직접 만든다.
            allow_sign_up: false
            auto_assign_org_role: Viewer
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
