# Grafana — 대시보드는 기존 infra/monitoring 것을 ConfigMap(sidecar)으로 로드
# datasource uid(prometheus/loki/tempo)는 대시보드 JSON이 참조하므로 로컬 스택과 동일하게 유지
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    # TODO(Phase 6): 설치 시점 최신 안정 버전 고정
    targetRevision: 8.8.0
    helm:
      valuesObject:
        fullnameOverride: grafana
        image:
          tag: 13.0.1 # compose와 동일
        # Secrets Manager /tapple/platform/monitoring/grafana-admin → ExternalSecret/grafana-admin
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        persistence:
          enabled: true
          storageClassName: local-path
          size: 1Gi
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 512Mi }
        testFramework:
          enabled: false
        # manifests/monitoring/dashboards/의 ConfigMap(label: grafana_dashboard=1)을 자동 로드
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            searchNamespace: monitoring
            provider:
              folder: tapple
        datasources:
          datasources.yaml:
            apiVersion: 1
            # 로컬 provisioning에서 cloudwatch(AWS 떠남)만 제외
            datasources:
              - name: Alertmanager
                type: alertmanager
                uid: alertmanager
                access: proxy
                url: http://prometheus-alertmanager.monitoring.svc.cluster.local:9093
                jsonData:
                  implementation: prometheus
              - name: Prometheus
                type: prometheus
                uid: prometheus
                access: proxy
                url: http://prometheus-server.monitoring.svc.cluster.local:80
                isDefault: true
                jsonData:
                  timeInterval: 30s
              - name: Loki
                type: loki
                uid: loki
                access: proxy
                url: http://loki.monitoring.svc.cluster.local:3100
                jsonData:
                  derivedFields:
                    - datasourceUid: tempo
                      matcherRegex: '"traceId":"(\w+)"'
                      name: traceId
                      url: '$${__value.raw}'
              - name: Tempo
                type: tempo
                uid: tempo
                access: proxy
                # grafana/tempo 차트의 http_listen_port 기본값 3100 (로컬 3200과 다름)
                url: http://tempo.monitoring.svc.cluster.local:3100
                jsonData:
                  tracesToLogsV2:
                    datasourceUid: loki
                    filterByTraceID: true
                  tracesToMetrics:
                    datasourceUid: prometheus
                  serviceMap:
                    datasourceUid: prometheus
                  nodeGraph:
                    enabled: true
        # ---------- 외부 노출 ----------
        # Cloudflare 가 TLS 를 종료한다. 오리진(traefik)은 http 로 받으므로 tls 블록이 비어 있다.
        # tapple.co.kr 은 Cloudflare DNS + 와일드카드 + Universal SSL 이 이미 있어서
        # cert-manager 도 Let's Encrypt 도 필요 없다 — A 레코드 하나로 끝난다.
        #
        # 남은 사람 작업:
        #   Cloudflare DNS →  grafana-k3s   A   <IDC_PUBLIC_IP>   [Proxied 🟠]
        #
        # 이름을 grafana 가 아니라 grafana-k3s 로 둔 이유: 와일드카드 때문에
        # grafana.tapple.co.kr 이 이미 홈서버로 응답한다(실측 HTTP 200). 겹치면 헷갈린다.
        #
        # 주의 — Cloudflare Universal SSL 은 tapple.co.kr 과 *.tapple.co.kr 만 커버한다.
        # 2단(pr-27.api.tapple.co.kr)은 인증서가 안 맞는다. 앱·프리뷰를 실도메인으로 옮길 때는
        # pr-27-api.tapple.co.kr 처럼 1단으로 평평하게 잡아야 한다.
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - grafana-k3s.tapple.co.kr
          # Cloudflare 가 종료하므로 오리진 인증서가 없다.
          # Full(strict) 로 올릴 때 Cloudflare Origin Certificate 를 여기 넣는다.
          tls: []

        env:
          # OAuth 리다이렉트와 링크 생성의 기준 주소. 없으면 구글 로그인이 엉뚱한 곳으로 돌아온다.
          # https 로 고정하므로 port-forward(localhost:3000)로 들어오면 일부 링크가 공개 주소를 가리킨다.
          GF_SERVER_ROOT_URL: https://grafana-k3s.tapple.co.kr

        # 시크릿이 아직 없어도 파드는 떠야 한다 → optional: true.
        # 없으면 변수가 비어 있을 뿐이고 auth.google 이 꺼져 있으니 무해하다.
        # optional 을 빼면 시크릿이 없는 동안 CreateContainerConfigError 로 Grafana 가 죽는다.
        envValueFrom:
          GF_AUTH_GOOGLE_CLIENT_ID:
            secretKeyRef:
              name: grafana-google-oauth
              key: client-id
              optional: true
          GF_AUTH_GOOGLE_CLIENT_SECRET:
            secretKeyRef:
              name: grafana-google-oauth
              key: client-secret
              optional: true

        grafana.ini:
          auth.google:
            # ↓ 켜는 스위치. 아래 셋이 끝난 뒤 true 로 바꾼다 ↓
            #   ① Cloudflare A 레코드 (위 참고)
            #   ② Google Cloud Console → 승인된 리다이렉트 URI 추가
            #        https://grafana-k3s.tapple.co.kr/login/google
            #   ③ Secrets Manager의 grafana-google-oauth JSON Secret 등록 후 ESO Ready 확인
            enabled: false # ← 여기만 true 로
            scopes: openid email profile
            # 핵심 — 이미 등록된 사용자만 로그인된다. 구글은 "누구인지"만 증명하고
            # "들어와도 되는지"는 Grafana 사용자 목록이 판정한다.
            # allowed_domains 를 쓰지 않는 이유: 팀원이 gmail.com 이면 도메인 제한이
            # 제한이 되지 않는다(구글 계정 있는 전원 통과). 명단 방식이 한 명씩 정확히 통제된다.
            allow_sign_up: false
            auto_login: false
          auth.anonymous:
            # 반드시 꺼둔다. port-forward 방식이라면 이걸 켜서 인증을 대신했겠지만,
            # Ingress 로 노출하는 설계에서는 켜는 순간 누구나 prod 지표를 본다.
            enabled: false
          users:
            allow_sign_up: false
            # 로그인한 사람의 기본 권한. Editor 면 대시보드를 지울 수 있다.
            # 대시보드 원본은 v1 레포이고 sidecar 가 주입하므로 조회만 주면 된다.
            auto_assign_org_role: Viewer
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
