# Sealed Secrets 컨트롤러 — upstream 차트 + 인라인 values (D16: vendoring 안 함)
# wave -2: 시크릿·앱보다 먼저 설치돼야 SealedSecret CRD가 존재
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    # TODO(Phase 7): 설치 시점에 `helm search repo sealed-secrets` 최신 안정 버전으로 고정
    targetRevision: 2.17.4
    helm:
      valuesObject:
        # kubeseal CLI 기본값이 이 이름을 찾음
        fullnameOverride: sealed-secrets-controller
        resources:
          requests: { cpu: 30m, memory: 64Mi }
          limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
