# 암호화된 SealedSecret들 sync — wave -1: 컨트롤러 다음, DB·앱 이전
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Tapplee/tapple-infra-v2.git
    targetRevision: main
    path: secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    # 각 SealedSecret 파일이 자기 namespace를 명시 — 여기 값은 기본값일 뿐
    namespace: app
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
    # 컨트롤러 CRD 등록이 늦어도 재시도로 수렴
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
