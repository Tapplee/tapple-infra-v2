# 앱 — 자작 Helm 차트 sync
# wave 1: DB 이후 (기동 순서는 어차피 probe가 지켜주지만 부트스트랩 시 불필요한 재시작 줄임)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tapple-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    repoURL: https://github.com/Tapplee/tapple-infra-v2.git
    targetRevision: main
    path: charts/tapple-server
    helm:
      # 기본 values.yaml 사용 — CI가 image.tag와 image.digest를 함께 바꾸면 자동 배포한다.
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
