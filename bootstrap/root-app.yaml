# app-of-apps 루트 — 재구축 시 수동 apply하는 유일한 Application
#   kubectl apply -n argocd -f bootstrap/root-app.yaml
# 이후 apps/ 아래 Application들이 자동 생성·동기화된다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Tapplee/tapple-infra-v2.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      # 루트는 prune 끔 — apps/에서 파일 삭제해도 자식 Application을 자동 삭제하지 않음(초기 운영 안전장치).
      # 구조가 안정되면 true로 올려도 됨
      prune: false
