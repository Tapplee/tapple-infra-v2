{{- range .Values.externalSecrets }}
{{- $remoteKey := required (printf "externalSecrets[%s/%s].remoteKey가 필요하다" .namespace .name) .remoteKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/managed-by: external-secrets
    tapple.io/secret-source: aws-secrets-manager
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ $.Values.refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .store }}
  target:
    name: {{ .targetName }}
    # ExternalSecret을 실수로 prune해도 실행 중 Secret은 남긴다. 명시적 폐기 때 따로 삭제한다.
    # CreateOrMerge는 계약에서 뺀 과거 key도 보존하므로 key 삭제 절차는 secrets/README.md를 따른다.
    creationPolicy: CreateOrMerge
    deletionPolicy: Retain
    template:
      type: {{ default "Opaque" .type }}
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          tapple.io/secret-source: aws-secrets-manager
  data:
    {{- range $secretKey, $remoteProperty := .data }}
    - secretKey: {{ $secretKey | quote }}
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: {{ $remoteProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
