# PR 프리뷰 오버라이드 — values.yaml 위에 덮어씀
#
# ApplicationSet 이 PR 마다 파라미터로 채우는 값 (여기서는 비워둔다)
#   fullnameOverride · ingress.host · createDatabase.name · image.tag
#   env.POSTGRES_URL · env.SPRING_APPLICATION_NAME · env.DEPLOY_ENV
#
# 자원은 dev 의 절반이다. PR 6개와 transient Job은 preview-budget ResourceQuota 안에 들어간다.

environment: preview

# 메모리 압박 시 dev 보다도 먼저 죽는다
priorityClassName: preview-lowest

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 1500m
    memory: 2Gi

# 프리뷰는 postgres 를 공유하고 PR 마다 database 를 나눈다 (createdb Job 이 만든다)
createDatabase:
  enabled: true

# CPU 가 적어 기동이 느리다 — dev 와 같은 여유
probes:
  startup:
    path: /actuator/health/liveness
    failureThreshold: 60
    periodSeconds: 5

env:
  # dev 와 같은 프로파일 조합. k3s 가 CloudWatch appender 를 떼고,
  # otel 이 OTLP push 를 켠다. dev 를 첫 자리에 유지해야 QaController 의
  # @Profile("!prod") 가 프리뷰에서 QA 엔드포인트를 열어준다(의도)
  SPRING_PROFILES_ACTIVE: dev,otel,k3s
  OTEL_URL: http://otel-collector.monitoring.svc.cluster.local:4318

# 프리뷰 전용 시크릿. /tapple/preview 경로에서 ESO가 동기화한다.
# prod 자격증명을 프리뷰에 쓰지 않는다 — 프리뷰는 URL 을 아는 사람이면 누구나 접근한다.
existingSecret: app-secrets

ingress:
  # ApplicationSet이 host만 만들 뿐 TLS Secret은 PR별로 만들지 않는다. 둘을 함께
  # 설계하기 전에는 preview Service를 클러스터 밖에 노출하지 않는다.
  enabled: false
  className: traefik
  tls: []
