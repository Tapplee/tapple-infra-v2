{{- if .Values.createDatabase.enabled }}
{{- /*
  PR 프리뷰용 database 생성. 프리뷰만 켠다 (prod·dev 는 database 가 시크릿에 이미 있다).

  왜 필요한가: 프리뷰는 postgres 한 대를 공유하고 PR 마다 database 를 나눈다.
  나누지 않으면 여러 PR 의 Flyway 가 같은 스키마를 동시에 고쳐 서로를 깬다.
  그런데 postgres 는 접속 시 database 를 자동으로 만들어주지 않는다 — 없으면 앱이
  "database does not exist" 로 죽는다. 그래서 앱보다 먼저 이 Job 이 만든다.

  sync-wave 를 앱보다 낮게 둬서 순서를 보장하고, \gexec 로 멱등하게 만든다
  (CREATE DATABASE 는 IF NOT EXISTS 를 지원하지 않는다).
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tapple-server.fullname" . }}-createdb
  labels:
    {{- include "tapple-server.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # 앱(기본 0)보다 먼저
    argocd.argoproj.io/sync-options: Replace=true # Job spec 은 immutable — 교체로 처리
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "tapple-server.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      priorityClassName: {{ .Values.priorityClassName }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: createdb
          image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # \gexec — SELECT 가 만들어낸 SQL 문자열을 실행한다. 이미 있으면 아무것도 안 만든다.
              # CREATE DATABASE 는 트랜잭션 안에서 못 돌아 psql 변수 + \gexec 조합을 쓴다.
              psql -v ON_ERROR_STOP=1 --set=db="$TARGET_DB" <<'SQL'
              SELECT format('CREATE DATABASE %I', :'db')
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db') \gexec
              SQL
              echo "database 준비 완료: $TARGET_DB"
          env:
            - name: PGHOST
              value: {{ .Values.createDatabase.host | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.createDatabase.existingSecret }}
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.createDatabase.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              value: {{ .Values.createDatabase.bootstrapDatabase | quote }}
            - name: TARGET_DB
              value: {{ required "createDatabase.name 이 필요하다" .Values.createDatabase.name | quote }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
{{- end }}
