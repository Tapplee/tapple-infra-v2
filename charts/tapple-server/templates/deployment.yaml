apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tapple-server.fullname" . }}
  labels:
    {{- include "tapple-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # ponytail: Recreate = 배포 중 수십 초 다운(D13 허용 범위).
  # RollingUpdate로 바꾸려면 노드 메모리가 앱 2개분(requests x2) 여유 필요 — 32GB 리사이즈 후.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tapple-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tapple-server.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # server.shutdown=graceful(기본 30s) + 여유
      terminationGracePeriodSeconds: 40
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag는 필수 — CI가 커밋 SHA로 설정" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp # heapdump(-XX:HeapDumpPath=/tmp) 포함
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: logs
          emptyDir:
            sizeLimit: 512Mi
