# dev 환경 오버라이드 — values.yaml 위에 덮어씀 (여기 없는 값은 prod와 동일)
# CI: develop 브랜치 머지 시 Actions가 이 파일의 image.tag만 bump

environment: dev

image:
  tag: "670524939ca2"

ingress:
  enabled: true
  # TODO: iwinv 컷오버 시 실도메인으로 교체 (dev-api.taple.co.kr 등)
  host: dev-api.141.164.40.139.nip.io

# prod의 1/2. 압박 시 가장 먼저 축출되도록 우선순위도 최하
# requests는 낮게(자리만 확보), limits는 넉넉히 — 유휴 CPU는 어차피 놀고 있다
resources:
  requests:
    cpu: 250m
    memory: 2Gi
  limits:
    cpu: 1500m
    memory: 3Gi

priorityClassName: dev-low

env:
  # k3s: CloudWatch appender 제거 (values.yaml 주석 참고). dev 를 첫 자리에 유지
  SPRING_PROFILES_ACTIVE: dev,otel,k3s
  # 대시보드의 Service 드롭다운은 label_values(service_name) 쿼리 변수라, 이름을 다르게 두면
  # taple / taple-dev 가 각각 선택 가능해진다. prod 와 같은 이름을 쓰면 두 환경 지표가 한 그래프에 섞인다.
  # 이 값은 Prometheus 의 application 라벨과 Loki·Tempo 의 service_name 에 동시에 반영된다.
  # 참고: Loki 로그 알림 규칙은 {service_name="taple"} 로 하드코딩돼 있어 dev 는 로그 알림이 뜨지 않는다(의도).
  SPRING_APPLICATION_NAME: taple-dev
  DEPLOY_ENV: dev
  POSTGRES_URL: jdbc:postgresql://postgres.dev-db.svc.cluster.local:5432/tapple_dev
  # 관측 스택은 prod와 공유 — deployment_environment=dev 라벨로 구분해서 본다
  OTEL_URL: http://otel-collector.monitoring.svc.cluster.local:4318

# 기동 여유는 prod보다 넉넉히 (CPU가 적어 느림)
probes:
  startup:
    path: /actuator/health/liveness
    failureThreshold: 60
    periodSeconds: 5
