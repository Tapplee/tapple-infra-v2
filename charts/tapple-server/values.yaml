# tapple-server 차트 기본값 — 단일 환경(prod)이라 이 파일 하나만 사용
# backend CD는 image.tag와 image.digest 두 줄을 함께 bump한다

# prod 는 접두어 없는 app·db 네임스페이스를 쓴다. 그 사실이 이름만으로는 드러나지 않아
# 리소스 라벨로 명시한다 (values-dev.yaml 이 dev 로 덮는다)
environment: prod

# 리소스 이름. 비우면 차트 이름(tapple-server)을 쓴다.
# PR 프리뷰만 tapple-server-pr-42 처럼 덮어써서 preview 네임스페이스 안에서 구분한다
fullnameOverride: ""

replicaCount: 1 # 단일 노드 — 늘리려면 노드 리사이즈 먼저

# 축출 순서: dev-low < (기본) < app-important < db-critical (manifests/cluster/priorityclasses.yaml)
priorityClassName: app-important

image:
  repository: ghcr.io/tapplee/tapple-be
  # tag는 사람이 추적할 메타데이터다. digest가 채워지면 실제 pull은 immutable digest를 쓴다.
  tag: "f6e142155b80"
  # 기존 태그 배포에서 전환하는 bootstrap 값. 다음 main CD가 실제 sha256 digest로 채운다.
  digest: ""
  pullPolicy: IfNotPresent

# ghcr private pull용 시크릿 (Secrets Manager /tapple/shared/ghcr-pull → ESO)
imagePullSecrets:
  - name: ghcr-pull

ports:
  # taple-be는 actuator를 앱 포트와 같이 쓴다 (management.server.port 미설정) — 별도 관리 포트 없음
  http: 8080

service:
  type: ClusterIP
  port: 80

# namespace 전체 default-deny와 앱의 최소 허용 경로를 같은 Argo sync에서 순서대로 적용한다.
# preview는 공유 namespace 정책을 manifests/postgres-preview가 한 번만 소유하므로 비활성화한다.
networkPolicy:
  enabled: true
  database:
    namespace: db
    podName: postgres

ingress:
  # fail-closed 기본값. 실제 host·origin TLS Secret이 준비된 뒤 환경별 values에서만 켠다.
  enabled: false
  className: traefik # k3s 내장 Traefik
  # enabled=true이면 template이 .invalid host, 빈 TLS, non-Traefik class를 거부한다.
  host: api.example.invalid
  tls: []
  # - secretName: cloudflare-origin-cert # 같은 namespace의 kubernetes.io/tls Secret
  #   hosts: [api.example.com]            # 위 ingress.host와 정확히 일치해야 함

# 계획 §4-2 — Burstable (8 vCPU / 32GB 노드 기준)
# JVM은 -XX:MaxRAMPercentage=75 → limits 6Gi면 힙 ~4.5Gi
# limits.cpu 3000m: Tomcat 200 스레드가 순간 몰릴 때 쓸 여지 (평상시엔 requests만 점유)
resources:
  requests:
    cpu: 1000m
    memory: 4Gi
  limits:
    cpu: 3000m
    memory: 6Gi

# 평문 OK인 환경변수만. 자격증명은 전부 existingSecret으로
env:
  # otel: OTLP push 활성 (taple-be application-otel.yml)
  # k3s: CloudWatch appender 를 떼는 스위치. 없으면 logback 의 prod 블록이 AwsLogsAppender 를
  #      붙이고, 클러스터에 AWS 자격증명이 없어 무한 재시도하며 로그를 자기 에러로 채운다.
  # prod 는 반드시 유지하고 첫 자리에 둔다 — QaController 의 @Profile("!prod") 가 QA 엔드포인트를
  #      차단하고, CaffeineCacheGatewayImpl 이 activeProfiles.firstOrNull() 을 본다.
  SPRING_PROFILES_ACTIVE: prod,otel,k3s
  # 대시보드·알림이 이 값을 그대로 쓴다 (Prometheus 의 application 라벨, Loki·Tempo 의 service_name).
  # prod 는 taple, dev 는 taple-dev — 대시보드 Service 드롭다운에서 골라 본다.
  # Loki 로그 알림 규칙이 {service_name="taple"} 로 하드코딩돼 있어 이 값을 바꾸면 그 알림이 죽는다.
  SPRING_APPLICATION_NAME: taple
  DEPLOY_ENV: prod
  # DB명은 홈서버 .env 실측값(tapple)에 맞춤.
  # docker-compose-prod.yml 에는 taple_prod, application.yml 기본값은 taple 로 적혀 있지만
  # 실제 구동에 쓰이는 값은 .env 의 tapple 이다 — pg_dump/restore 가 이 이름을 따라간다
  POSTGRES_URL: jdbc:postgresql://postgres.db.svc.cluster.local:5432/tapple
  # 비밀이 아닌 고정 app role. password만 별도 postgres-app Secret에서 주입한다.
  POSTGRES_USERNAME: tapple_app
  # OTLP 게이트웨이 — 메트릭·트레이스·로그 전부 여기로 push (scrape 아님)
  OTEL_URL: http://otel-collector.monitoring.svc.cluster.local:4318
  # D7: k3s의 prod/dev/preview가 시작하는 root trace를 전량 head sampling한다.
  OTEL_TRACE_SAMPLE: "1.0"
  # 운영에서만 개인정보·미디어 보유기간 만료 대상을 정기 파기한다.
  MEDIA_STORAGE_PURGE_ENABLED: "true"
  PRIVACY_RETENTION_ENABLED: "true"

# JWT_SECRET_KEY / OTEL_AUTH_HEADER 등 일반 앱 자격증명
existingSecret: app-secrets
# 관리자 postgres-secrets와 분리한 최소권한 앱 DB 비밀번호
databaseSecret: postgres-app

# PR 프리뷰만 켠다. 프리뷰는 postgres 한 대를 공유하고 PR 마다 database 를 나누는데,
# postgres 는 없는 database 를 자동으로 만들어주지 않아 앱보다 먼저 만들어줘야 한다.
# prod·dev 는 database 가 postgres-secrets 에 이미 있으므로 끈다.
createDatabase:
  enabled: false
  name: "" # 예: tapple_pr42
  owner: "" # preview에서는 최소권한 앱 role인 tapple_preview_app
  host: postgres-preview.preview.svc.cluster.local
  bootstrapDatabase: preview_bootstrap
  existingSecret: postgres-preview-secrets
  activeDeadlineSeconds: 300
  backoffLimit: 5
  connectTimeoutSeconds: "5"
  statementTimeout: 30s

# PR Application 삭제 후 createDatabase.name과 정확히 같은 database만 지우는
# Argo CD PostDelete Job. 연결 정보도 createDatabase 계약을 재사용해 target drift를 막는다.
# prod·dev에서는 항상 꺼두고 values-preview.yaml에서만 켠다.
deleteDatabase:
  enabled: false
  activeDeadlineSeconds: 120
  backoffLimit: 1
  connectTimeoutSeconds: "10"
  statementTimeout: 30s
  lockTimeout: 5s
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

probes:
  # Spring Boot가 k8s 감지 시 liveness/readiness 그룹 자동 활성화
  startup:
    path: /actuator/health/liveness
    failureThreshold: 30 # 저CPU(500m) 기동 대비 최대 150s 허용
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 10

# Dockerfile의 spring 유저 (eclipse-temurin alpine에서 실측: uid 100 / gid 101)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true # 쓰기 경로는 /tmp, /app/logs emptyDir로
  capabilities:
    drop: ["ALL"]

# taple-be는 메트릭을 OTLP로 push한다(micrometer-registry-otlp) — Prometheus 스크레이프 대상이 아니다.
# 그래서 prometheus.io/scrape 애노테이션을 붙이지 않는다.
podAnnotations: {}
