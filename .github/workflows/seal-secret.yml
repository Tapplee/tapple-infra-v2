# 시크릿 씰링 — 클러스터에 SSH 하지 않고 레포에서 처리한다
#
# 원리: sealed-secrets 의 공개키(secrets/sealed-secrets-pub.pem)는 암호화 전용이라
# 레포에 커밋해도 안전하다. 복호화는 클러스터 안 개인키만 할 수 있다.
# 그래서 러너가 클러스터 접속 없이 씰링할 수 있다.
#
# 평문은 이 레포의 Actions 시크릿에 넣는다.
# workflow_dispatch 입력값은 실행 기록에 평문으로 남으므로 평문을 입력창으로 받지 않는다.
#
# 사용법:
#   1) Settings → Secrets and variables → Actions 에 필요한 시크릿 등록 (아래 표)
#   2) Actions → Seal secrets → Run workflow → 대상 선택
#   3) 워크플로가 secrets/*.yaml 을 갱신해 main 에 커밋 → ArgoCD 가 반영
#
# | 대상        | 필요한 Actions 시크릿                                            |
# |-------------|-----------------------------------------------------------------|
# | ghcr-pull   | GHCR_USERNAME, GHCR_PAT (classic PAT, read:packages)            |
# | preview     | 위 둘 + PREVIEW_GITHUB_TOKEN (fine-grained, PR read)            |
#
# 봇이 만드는 산출물은 전부 암호문이라 사람이 리뷰할 내용이 없어 main 에 직접 커밋한다.

name: Seal secrets

on:
  workflow_dispatch:
    inputs:
      target:
        description: "씰링할 대상"
        required: true
        type: choice
        options:
          - ghcr-pull
          - preview

concurrency:
  group: seal-secret
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 클러스터 컨트롤러와 같은 버전으로 고정한다.
      # 최신 릴리스를 조회하던 코드가 있었지만 두 가지 이유로 버렸다.
      #  1) `curl | grep -m1` 은 grep 이 첫 매치에서 파이프를 닫아 curl 이 쓰기 실패(exit 23)를
      #     낼 수 있고, pipefail 이 그걸 잡아 스크립트를 죽인다 — 타이밍에 따라 되다 안 되는 경합.
      #  2) 씰링 도구 버전이 실행 시점마다 달라지는 것 자체가 재현성에 해롭다.
      # 컨트롤러를 올리면(apps/platform/sealed-secrets.yaml) 여기도 같이 올린다.
      - name: kubeseal 설치
        env:
          KUBESEAL_VERSION: "0.38.4"
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz" -o /tmp/ks.tgz
          tar -xzf /tmp/ks.tgz -C /tmp kubeseal
          sudo install -m 755 /tmp/kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      - name: 공개키 확인
        run: |
          set -euo pipefail
          CERT=secrets/sealed-secrets-pub.pem
          [[ -s "$CERT" ]] || { echo "::error::${CERT} 가 없다"; exit 1; }
          # 개인키가 섞여 들어오는 사고를 막는다
          if grep -q "PRIVATE" "$CERT"; then
            echo "::error::${CERT} 에 개인키가 들어 있다. 공개 인증서만 커밋해야 한다"
            exit 1
          fi
          openssl x509 -in "$CERT" -noout -dates

      - name: ghcr-pull 씰링
        if: inputs.target == 'ghcr-pull'
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          : "${GHCR_USERNAME:?Actions 시크릿 GHCR_USERNAME 이 없다}"
          : "${GHCR_PAT:?Actions 시크릿 GHCR_PAT 이 없다}"

          # app / dev-app 두 네임스페이스에 같은 자격증명이 필요하다.
          # 네임스페이스가 다르면 별개 Secret 이므로 각각 씰링한다.
          seal_one() {
            local ns="$1" out="$2"
            kubectl create secret docker-registry ghcr-pull \
              --namespace "$ns" \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USERNAME}" \
              --docker-password="${GHCR_PAT}" \
              --dry-run=client -o yaml \
            | kubeseal --cert secrets/sealed-secrets-pub.pem --format yaml > "$out"
            echo "생성: $out"
          }
          seal_one app     secrets/ghcr-pull.yaml
          seal_one dev-app secrets/dev-ghcr-pull.yaml

          # 평문이 새어나가지 않았는지 확인 — 암호문에 토큰 조각이 있으면 즉시 중단
          for f in secrets/ghcr-pull.yaml secrets/dev-ghcr-pull.yaml; do
            if grep -qF "${GHCR_PAT}" "$f"; then
              echo "::error::${f} 에 평문 토큰이 들어 있다"
              rm -f secrets/ghcr-pull.yaml secrets/dev-ghcr-pull.yaml
              exit 1
            fi
            grep -q "^kind: SealedSecret" "$f" || { echo "::error::${f} 가 SealedSecret 이 아니다"; exit 1; }
          done

      - name: preview 씰링 (시크릿 4종)
        if: inputs.target == 'preview'
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          PREVIEW_GITHUB_TOKEN: ${{ secrets.PREVIEW_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${GHCR_USERNAME:?Actions 시크릿 GHCR_USERNAME 이 없다}"
          : "${GHCR_PAT:?Actions 시크릿 GHCR_PAT 이 없다}"
          : "${PREVIEW_GITHUB_TOKEN:?Actions 시크릿 PREVIEW_GITHUB_TOKEN 이 없다}"

          seal() { kubeseal --cert secrets/sealed-secrets-pub.pem --format yaml > "$1"; }

          # ① ArgoCD 가 PR 목록을 읽을 토큰. argocd 네임스페이스에 들어간다
          kubectl create secret generic preview-github-token --namespace argocd \
            --from-literal=token="${PREVIEW_GITHUB_TOKEN}" \
            --dry-run=client -o yaml | seal secrets/preview-github-token.yaml

          # ② 프리뷰 공유 DB 계정. 운영 자격증명과 분리한다 —
          #    프리뷰는 URL 을 아는 사람이면 누구나 접근하므로 운영 비번을 쓰면 안 된다
          PREVIEW_DB_PW=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          kubectl create secret generic postgres-preview-secrets --namespace preview \
            --from-literal=POSTGRES_USER=tapple \
            --from-literal=POSTGRES_PASSWORD="${PREVIEW_DB_PW}" \
            --dry-run=client -o yaml | seal secrets/preview-postgres-secrets.yaml

          # ③ 프리뷰 앱 환경변수.
          #    서명·HMAC 키는 새로 생성해 운영과 격리한다. 외부 연동(S3·Google·Discord)은
          #    더미다 — 프리뷰에서 업로드·로그인은 범위 밖이고, 로그인은 어차피 동작하지 않는다
          #    (Google OAuth 는 리다이렉트 URI 사전 등록 + HTTPS 를 요구한다).
          #    URL 계열(CORS_ALLOWED_ORIGINS·PUBLIC_*·*_REDIRECT_URI)은 여기 넣지 않는다 —
          #    PR 마다 호스트가 달라야 해서 ApplicationSet 이 차트 env 로 채운다.
          rnd() { openssl rand -hex 32; }
          kubectl create secret generic app-secrets --namespace preview \
            --from-literal=POSTGRES_USERNAME=tapple \
            --from-literal=POSTGRES_PASSWORD="${PREVIEW_DB_PW}" \
            --from-literal=JWT_SECRET_KEY="$(rnd)" \
            --from-literal=JWT_ACCESS_EXPIRATION=3600 \
            --from-literal=JWT_REFRESH_EXPIRATION=1209600 \
            --from-literal=SHARE_PREVIEW_SERVICE_TOKEN="$(rnd)" \
            --from-literal=SHARE_PREVIEW_PREVIOUS_SERVICE_TOKEN= \
            --from-literal=SHARE_PREVIEW_LOG_HMAC_KEY="$(rnd)" \
            --from-literal=SLUG_RESERVATION_HMAC_KEY="$(rnd)" \
            --from-literal=SLUG_RESERVATION_HMAC_KEY_VERSION=1 \
            --from-literal=GOOGLE_CLIENT_ID=preview-dummy \
            --from-literal=GOOGLE_CLIENT_SECRET=preview-dummy \
            --from-literal=S3_BUCKET_NAME=preview-dummy \
            --from-literal=S3_REGION=ap-northeast-2 \
            --from-literal=S3_ACCESS_KEY=preview-dummy \
            --from-literal=S3_SECRET_KEY=preview-dummy \
            --from-literal=DISCORD_NOTIFY_ID=0 \
            --from-literal=DISCORD_NOTIFY_TOKEN=preview-dummy \
            --from-literal=DISCORD_ERRORS_ID=0 \
            --from-literal=DISCORD_ERRORS_TOKEN=preview-dummy \
            --from-literal=HIKARI_MAX_POOL_SIZE=5 \
            --from-literal=HIKARI_MIN_IDLE=2 \
            --from-literal=REFRESH_COOKIE_SECURE=false \
            --from-literal=REFRESH_COOKIE_SAME_SITE=Lax \
            --from-literal=HIBERNATE_SHOW_SQL=OFF \
            --from-literal=OTEL_TRACE_SAMPLE=1.0 \
            --from-literal=OTEL_AUTH_HEADER="Bearer preview-dummy" \
            --dry-run=client -o yaml | seal secrets/preview-app-secrets.yaml

          # ④ 이미지 pull. 같은 토큰이라도 네임스페이스가 다르면 다시 씰링해야 한다
          kubectl create secret docker-registry ghcr-pull --namespace preview \
            --docker-server=ghcr.io --docker-username="${GHCR_USERNAME}" \
            --docker-password="${GHCR_PAT}" \
            --dry-run=client -o yaml | seal secrets/preview-ghcr-pull.yaml

          # 평문 유출 검사 — 하나라도 걸리면 전부 지우고 중단한다
          for f in secrets/preview-*.yaml; do
            for v in "${GHCR_PAT}" "${PREVIEW_GITHUB_TOKEN}" "${PREVIEW_DB_PW}"; do
              if grep -qF "$v" "$f"; then
                echo "::error::$f 에 평문이 들어 있다"
                rm -f secrets/preview-*.yaml
                exit 1
              fi
            done
            grep -q "^kind: SealedSecret" "$f" || { echo "::error::$f 가 SealedSecret 이 아니다"; exit 1; }
          done
          echo "프리뷰 시크릿 4종 생성 완료"

      - name: 커밋
        run: |
          set -euo pipefail

          # 반드시 add 를 먼저 하고 --cached 로 검사한다.
          # git diff 는 추적 중인 파일만 보므로, 처음 만들어진 secrets/*.yaml(untracked)은
          # 잡히지 않는다. add 전에 검사하면 "변경 없음"으로 오판해 커밋 없이 끝나고
          # 러너가 사라질 때 씰링 결과도 같이 날아간다.
          git add secrets/
          if git diff --cached --quiet; then
            echo "변경 없음 — 같은 값으로 다시 씰링했다"
            exit 0
          fi

          git config user.name "tapple-ci[bot]"
          git config user.email "ci@tapple.invalid"
          git commit -m "chore(secrets): ${{ inputs.target }} 씰링 갱신"

          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
            sleep $((i * 3))
          done
          echo "::error::push 실패 (3회 재시도)"
          exit 1

      - name: 요약
        if: always()
        run: |
          {
            echo "### 씰링: ${{ inputs.target }}"
            echo ""
            echo "ArgoCD 가 \`secrets\` Application 을 sync 하면 클러스터에 반영됩니다."
            echo "반영 확인: \`kubectl get sealedsecret -A\` / \`kubectl get secret -n app ghcr-pull\`"
          } >> $GITHUB_STEP_SUMMARY
