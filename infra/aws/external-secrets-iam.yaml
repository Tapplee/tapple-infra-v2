AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege IAM identities for tapple External Secrets Operator

# 이 스택은 자격증명 값이나 Secrets Manager Secret을 만들지 않는다.
# bootstrap user는 Secret을 직접 읽지 못하고, namespace가 맞는 환경 역할만 AssumeRole한다.
Resources:
  BootstrapUser:
    Type: AWS::IAM::User
    Properties:
      UserName: tapple-external-secrets-bootstrap
      Tags:
        - Key: managed-by
          Value: cloudformation
        - Key: purpose
          Value: external-secrets-bootstrap

  ProdRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tapple-secrets-prod
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: [app, db]
      Policies:
        - PolicyName: read-tapple-prod-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                # Secrets Manager ARN의 자동 6자리 suffix만 허용한다. -*는 같은 접두사의 다른 이름까지 넓어진다.
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/prod/app-secrets-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/prod/postgres-app-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/prod/postgres-secrets-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/prod/postgres-readonly-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/prod/backup-s3-??????"

  DevRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tapple-secrets-dev
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: [dev-app, dev-db]
      Policies:
        - PolicyName: read-tapple-dev-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/dev/app-secrets-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/dev/postgres-app-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/dev/postgres-secrets-??????"

  PreviewRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tapple-secrets-preview
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: preview
      Policies:
        - PolicyName: read-tapple-preview-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/preview/app-secrets-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/preview/postgres-app-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/preview/postgres-preview-secrets-??????"

  MonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tapple-secrets-monitoring
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: monitoring
      Policies:
        - PolicyName: read-tapple-monitoring-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/platform/monitoring/grafana-admin-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/platform/monitoring/grafana-origin-tls-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/platform/monitoring/alertmanager-discord-??????"

  ArgoCDRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tapple-secrets-argocd
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: argocd
      Policies:
        - PolicyName: read-tapple-argocd-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/platform/argocd/preview-github-token-??????"

  SharedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tapple-secrets-shared
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager-shared
                aws:RequestTag/esoNamespace: [app, dev-app, preview]
      Policies:
        - PolicyName: read-tapple-shared-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tapple/shared/ghcr-pull-??????"

  BootstrapAssumeRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: assume-tapple-secret-roles
      Users: [!Ref BootstrapUser]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [sts:AssumeRole, sts:TagSession]
            Resource:
              - !GetAtt ProdRole.Arn
              - !GetAtt DevRole.Arn
              - !GetAtt PreviewRole.Arn
              - !GetAtt MonitoringRole.Arn
              - !GetAtt ArgoCDRole.Arn
              - !GetAtt SharedRole.Arn

Outputs:
  BootstrapUserName:
    Value: !Ref BootstrapUser
  AwsAccountId:
    Value: !Ref AWS::AccountId
  AwsRegion:
    Value: !Ref AWS::Region
