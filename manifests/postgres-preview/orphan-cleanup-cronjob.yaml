# 고아 database 정리 — PR 이 닫히면 Application 은 사라지지만 database 는 남는다.
#
# ApplicationSet 이 지우는 것은 Deployment·Service·Ingress·Job 이다. database 는
# 쿠버네티스 리소스가 아니라 postgres 안의 객체라 아무도 지우지 않는다.
# 방치하면 프리뷰 DB 에 tapple_prNN 이 무한히 쌓인다.
#
# 판정 기준: tapple_pr% 형태이고 마지막 접속이 7일을 넘긴 database.
# 접속 통계(pg_stat_database)가 리셋되면 오탐할 수 있어 DROP 전에 목록을 로그로 남긴다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: preview-db-cleanup
  labels:
    app.kubernetes.io/name: postgres-preview
    app.kubernetes.io/component: cleanup
    environment: preview
spec:
  schedule: "30 4 * * 1" # 매주 월요일 04:30 KST
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          priorityClassName: preview-lowest
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: postgres:16
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  echo "--- 삭제 대상 (마지막 접속 7일 초과)"
                  psql -v ON_ERROR_STOP=1 -tAc "
                    select datname from pg_database
                    where datname like 'tapple\_pr%'
                      and not exists (
                        select 1 from pg_stat_activity where datname = pg_database.datname
                      )
                      and (pg_stat_file('base/'||oid||'/PG_VERSION')).modification < now() - interval '7 days'"
                  echo "--- 삭제 실행"
                  psql -v ON_ERROR_STOP=1 -tAc "
                    select format('DROP DATABASE %I', datname) from pg_database
                    where datname like 'tapple\_pr%'
                      and not exists (
                        select 1 from pg_stat_activity where datname = pg_database.datname
                      )
                      and (pg_stat_file('base/'||oid||'/PG_VERSION')).modification < now() - interval '7 days'" \
                  | while read -r stmt; do
                      [ -n "$stmt" ] || continue
                      echo "  $stmt"
                      psql -v ON_ERROR_STOP=1 -c "$stmt"
                    done
                  echo "정리 완료"
              env:
                - name: PGHOST
                  value: postgres-preview.preview.svc.cluster.local
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: postgres-preview-secrets, key: POSTGRES_USER }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: postgres-preview-secrets, key: POSTGRES_PASSWORD }
                - name: PGDATABASE
                  value: preview_bootstrap
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
