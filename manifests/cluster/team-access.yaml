# 팀원 DB 접속용 최소 권한 (docs/db-access.md)
#
# 왜 이게 있나: 노드의 /etc/rancher/k3s/k3s.yaml 을 그대로 나눠주면 cluster-admin 이 통째로 넘어간다.
# 팀원에게 필요한 건 "dev·prod DB 파드로 port-forward" 뿐이라 그만큼만 준다.
#
# 줄 것: pods·services 조회, pods/portforward 생성
# 안 줄 것: exec(컨테이너 셸), delete, prod 시크릿 읽기, 그 외 모든 네임스페이스
#
# ponytail: 팀 전체가 SA 하나를 공유한다. 누가 언제 붙었는지 감사 로그로 구분해야 하면
#           사람별 SA 로 쪼갠다(RoleBinding subjects 에 추가). 지금 규모엔 과함.
apiVersion: v1
kind: Namespace
metadata:
  name: team-access
  labels:
    app.kubernetes.io/part-of: tapple-infra
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teammate
  namespace: team-access
---
# ---------- dev (dev-db) ----------
# dev 는 빈 DB + Flyway 라 상용 계정을 그대로 쓴다 → 시크릿 읽기를 허용해야 접속 정보를 알 수 있다
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-portforward
  namespace: dev-db
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-secrets"] # 이 시크릿 하나만. 목록 조회(list)는 주지 않는다
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-portforward
  namespace: dev-db
subjects:
  - kind: ServiceAccount
    name: teammate
    namespace: team-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: db-portforward
---
# ---------- prod (db) ----------
# prod 는 읽기전용 DB 계정(tapple_ro)을 따로 발급하므로 시크릿 읽기를 주지 않는다.
# 계정 비밀번호는 postgres-readonly 시크릿에 있고, 그건 운영자만 읽는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-portforward
  namespace: db
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-portforward
  namespace: db
subjects:
  - kind: ServiceAccount
    name: teammate
    namespace: team-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: db-portforward
