# 네임스페이스 명시 생성 (wave -3)
#
# environment 라벨을 붙인다. prod 가 "접두어가 없는 것"이라는 암묵적 규칙으로만 표현되면
# 다이어그램도 kubectl 도 그걸 말해주지 못한다. 라벨이 있으면
#   kubectl get ns -l environment=prod
#   NetworkPolicy 의 namespaceSelector: matchLabels: {environment: prod}
# 가 가능해지고, 그림에도 환경이 드러난다.
# ArgoCD의 CreateNamespace=true는 Application의 destination 하나만 만든다.
# secrets Application 하나가 여러 네임스페이스에 SealedSecret을 뿌리므로,
# 그 전에 네임스페이스가 전부 존재해야 한다 (없으면 sync 실패 → 뒤 wave 정지).
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    environment: prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: db
  labels:
    environment: prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    environment: shared
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-app
  labels:
    environment: dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-db
  labels:
    environment: dev
