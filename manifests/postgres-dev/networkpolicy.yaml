# dev DB 접근 제한 — 기본은 "누구나 접속 가능"이다
#
# 네임스페이스는 이름을 나눌 뿐 네트워크를 막지 않는다. NetworkPolicy 가 없으면
# monitoring·preview·dev-app 의 어느 파드든 postgres.db.svc:5432 에 접속할 수 있다.
# 프리뷰처럼 짧게 살다 사라지는 워크로드가 늘어날수록 이게 위험해진다.
#
# 여는 것
#   - dev-app 네임스페이스
#   - db 네임스페이스 자신 (백업 CronJob·읽기전용 롤 Job 이 여기서 돈다)
#   - 팀원의 kubectl port-forward — 이건 kubelet 이 노드에서 프록시하므로
#     파드 간 트래픽이 아니고 NetworkPolicy 대상이 아니다. 접근 통제는 RBAC 이 한다
#     (manifests/cluster/team-access.yaml)
#
# k3s 는 NetworkPolicy 를 기본 지원한다(별도 CNI 설치 불필요).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-dev-allow-dev-app-only
  labels:
    app.kubernetes.io/name: postgres
    environment: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    - from:
        # 운영 앱
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dev-app
        # db 네임스페이스 안의 것들 (pg-backup CronJob, postgres-readonly-role Job)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dev-db
      ports:
        - protocol: TCP
          port: 5432
