# dev 전용 PostgreSQL — prod(manifests/postgres/statefulset.yaml)의 축소판.
#
# ⚠️ prod와 반드시 같이 고쳐야 하는 값: image 태그(PG 메이저 버전).
#    버전이 어긋나면 dev에서 통과한 마이그레이션이 prod에서 깨진다.
#
# prod와 의도적으로 다른 점: 리소스 1/5, 우선순위 최하(dev-low), 백업 없음, 튜닝 기본값.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    environment: dev
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      priorityClassName: dev-low # 메모리 압박 시 prod보다 먼저 축출
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16 # ← prod와 동일하게 유지할 것
          args:
            - -c
            - shared_buffers=512MB # limits.memory 2Gi의 25%
            - -c
            - max_connections=30
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_DB }
            # PGDATA 를 볼륨 루트가 아닌 하위 디렉터리로 둔다 — 공식 이미지 권고사항이고,
            # 볼륨 루트에 lost+found 같은 게 있어도 initdb 가 거부하지 않는다
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            # prod 와 같은 이유 — postgres:16 의 PGDATA 경로에 정확히 마운트해야 한다.
            # 한 단계 위에 마운트하면 이미지가 선언한 VOLUME 이 익명 볼륨으로 PVC 를 덮고,
            # 데이터가 컨테이너 스냅샷에 쌓여 파드 재생성 시 사라진다.
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      # environment 라벨을 여기 넣으면 안 된다. spec.volumeClaimTemplates 는 불변 필드라
      # 기존 StatefulSet 갱신이 admission 단계에서 거부된다(서버 dry-run 으로 확인).
      #   Forbidden: updates to statefulset spec for fields other than 'replicas',
      #   'ordinals', 'template', 'updateStrategy', ... are forbidden
      # 그래서 이 PVC 는 다이어그램의 환경 박스 밖에 남는다 — 그림의 한계로 받아들인다.
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
