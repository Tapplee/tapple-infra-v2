# 운영 애플리케이션 전용 PostgreSQL role. 앱에는 관리자 postgres-secrets를 주지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-app-role
  namespace: db
  labels:
    app.kubernetes.io/name: postgres-app-role
    app.kubernetes.io/component: database-bootstrap
    environment: prod
  annotations:
    # Job spec은 불변이다. manifest 변경 시 Argo CD가 안전하게 재생성한다.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-app-role
        app.kubernetes.io/component: database-bootstrap
        environment: prod
    spec:
      restartPolicy: Never
      priorityClassName: db-critical
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
          command: ["sh", "-ec"]
          args:
            - |
              database_ready=false
              for i in $(seq 1 40); do
                if pg_isready -q; then
                  database_ready=true
                  break
                fi
                sleep 3
              done
              test "$database_ready" = true

              psql -v ON_ERROR_STOP=1 --set=app_pw="$APP_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE tapple_app LOGIN PASSWORD %L', :'app_pw')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'tapple_app') \gexec
              SELECT format('ALTER ROLE tapple_app LOGIN PASSWORD %L', :'app_pw') \gexec
              ALTER ROLE tapple_app NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1 FROM pg_auth_members
                  WHERE member = (SELECT oid FROM pg_roles WHERE rolname = 'tapple_app')
                ) THEN
                  RAISE EXCEPTION 'tapple_app must not inherit another role';
                END IF;
              END
              $$;

              ALTER DATABASE :"DBNAME" OWNER TO tapple_app;
              ALTER SCHEMA public OWNER TO tapple_app;
              GRANT CONNECT, TEMPORARY ON DATABASE :"DBNAME" TO tapple_app;
              SQL
          env:
            - name: PGHOST
              value: postgres.db.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
            - name: PGDATABASE
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_DB }
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGOPTIONS
              value: "-c statement_timeout=30s -c lock_timeout=10s"
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-app, key: POSTGRES_PASSWORD }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
