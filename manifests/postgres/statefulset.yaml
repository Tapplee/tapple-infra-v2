apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    environment: prod
spec:
  serviceName: postgres-headless
  replicas: 1 # 단일 노드 — 복제 없음, 백업이 유일한 복구선 (D14)
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      priorityClassName: db-critical # manifests/cluster/priorityclasses.yaml
      automountServiceAccountToken: false
      # 체크포인트/정리 시간 확보 — 짧으면 강제종료로 복구 시간 늘어남
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # 공식 postgres(debian) 이미지의 postgres 유저
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # 메이저 16 = 현 운영(홈서버 docker-compose-prod.yml의 postgres:16-alpine)과 동일.
          # 이전과 메이저 업그레이드를 한 번에 하지 않으려고 맞춘 값 — alpine이 아닌 이유는 collation(musl vs glibc).
          # TODO: 마이너까지 고정할지는 컷오버 직전 결정
          image: postgres:16
          args:
            # 튜닝은 ConfigMap 대신 args로 — 파일 하나 덜 만들고 값이 여기 다 보임 (계획 Phase 3의 "튜닝 ConfigMap"을 단순화)
            # 아래 값은 limits.memory 8Gi 기준 (계획 §4-2). 메모리를 바꾸면 같이 조정
            - -c
            - shared_buffers=2GB # 컨테이너 메모리의 25%
            - -c
            - effective_cache_size=6GB
            - -c
            - work_mem=16MB
            - -c
            - maintenance_work_mem=512MB
            - -c
            - max_connections=60 # §8-4 해결: 앱 Hikari 풀 10 (application.yml) — 60이면 충분한 여유
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            # secrets/postgres-secrets.yaml (SealedSecret, db 네임스페이스)
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_DB }
          # Guaranteed QoS: requests == limits (cpu·memory 모두) — 계획 §4-3 eviction 방어
          # Guaranteed QoS 조건: cpu·memory 모두 requests == limits
          # 예약해도 유휴분은 다른 파드가 쓴다 — vacuum·인덱스 빌드·pg_dump에 실코어 2개 확보
          resources:
            requests:
              cpu: 2000m
              memory: 8Gi
            limits:
              cpu: 2000m
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            # PG 18 이미지는 마운트 지점이 /var/lib/postgresql (17 이하의 /var/lib/postgresql/data 아님).
            # PGDATA 기본값 /var/lib/postgresql/18/docker — lost+found 문제 자동 회피
            - name: data
              mountPath: /var/lib/postgresql
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path # k3s 내장 — NVMe 직결. 노드 소실 = 데이터 소실 → 백업 필수
        resources:
          requests:
            storage: 20Gi
