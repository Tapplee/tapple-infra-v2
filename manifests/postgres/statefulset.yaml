apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    environment: prod
spec:
  serviceName: postgres-headless
  replicas: 1 # 단일 노드 — 복제 없음, 백업이 유일한 복구선 (D14)
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      priorityClassName: db-critical # manifests/cluster/priorityclasses.yaml
      automountServiceAccountToken: false
      # 체크포인트/정리 시간 확보 — 짧으면 강제종료로 복구 시간 늘어남
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # 공식 postgres(debian) 이미지의 postgres 유저
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # 메이저 16 = 현 운영(홈서버 docker-compose-prod.yml의 postgres:16-alpine)과 동일.
          # 이전과 메이저 업그레이드를 한 번에 하지 않으려고 맞춘 값 — alpine이 아닌 이유는 collation(musl vs glibc).
          # 공식 16/bookworm multi-arch manifest를 digest로 고정한다. helper Job도 같은 digest를 쓴다.
          image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
          args:
            # 튜닝은 ConfigMap 대신 args로 — 파일 하나 덜 만들고 값이 여기 다 보임 (계획 Phase 3의 "튜닝 ConfigMap"을 단순화)
            # 아래 값은 limits.memory 8Gi 기준 (계획 §4-2). 메모리를 바꾸면 같이 조정
            - -c
            - shared_buffers=2GB # 컨테이너 메모리의 25%
            - -c
            - effective_cache_size=6GB
            - -c
            - work_mem=16MB
            - -c
            - maintenance_work_mem=512MB
            - -c
            - max_connections=60 # §8-4 해결: 앱 Hikari 풀 10 (application.yml) — 60이면 충분한 여유
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            # Secrets Manager /tapple/prod/postgres-secrets JSON → ExternalSecret/postgres-secrets (db)
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_DB }
            # PGDATA 를 볼륨 루트가 아닌 하위 디렉터리로 둔다 — 공식 이미지 권고사항이고,
            # 볼륨 루트에 lost+found 같은 게 있어도 initdb 가 거부하지 않는다
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Guaranteed QoS: requests == limits (cpu·memory 모두) — 계획 §4-3 eviction 방어
          # Guaranteed QoS 조건: cpu·memory 모두 requests == limits
          # 예약해도 유휴분은 다른 파드가 쓴다 — vacuum·인덱스 빌드·pg_dump에 실코어 2개 확보
          resources:
            requests:
              cpu: 2000m
              memory: 8Gi
            limits:
              cpu: 2000m
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            # postgres:16 은 PGDATA 가 /var/lib/postgresql/data 이고, 이미지가 그 경로를
            # VOLUME 으로 선언한다. 한 단계 위(/var/lib/postgresql)에 PVC 를 마운트하면
            # containerd 가 그 이미지 VOLUME 을 익명 볼륨으로 만들어 PVC 를 덮어버린다
            # → 데이터가 컨테이너 스냅샷에 쌓이고 파드 재생성 시 사라진다(실측으로 확인).
            # 그래서 정확히 그 경로에 마운트해 익명 볼륨이 생기지 않게 한다.
            # (매니페스트 원안은 postgres:18 기준이었고, 18 은 데이터 경로가
            #  /var/lib/postgresql/<버전>/docker 라 한 단계 위 마운트가 맞았다)
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: run
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      # environment 라벨을 여기 넣으면 안 된다. spec.volumeClaimTemplates 는 불변 필드라
      # 기존 StatefulSet 갱신이 admission 단계에서 거부된다(서버 dry-run 으로 확인).
      #   Forbidden: updates to statefulset spec for fields other than 'replicas',
      #   'ordinals', 'template', 'updateStrategy', ... are forbidden
      # 그래서 이 PVC 는 다이어그램의 환경 박스 밖에 남는다 — 그림의 한계로 받아들인다.
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path # k3s 내장 — NVMe 직결. 노드 소실 = 데이터 소실 → 백업 필수
        resources:
          requests:
            storage: 20Gi
