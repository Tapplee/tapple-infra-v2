# pg_dump → 노드 밖 S3 호환 오브젝트 스토리지 (계획 D14, Phase 9)
# 컷오버 후 매일 03:00 KST(= 18:00 UTC). 그 전에는 suspend하고 수동 restore 리허설부터 통과시킨다.
# 배포 직전 백업은 CI가 `kubectl create job --from=cronjob/pg-backup`으로 트리거
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  labels:
    app.kubernetes.io/name: pg-backup
    app.kubernetes.io/component: backup
    environment: prod
spec:
  schedule: "0 18 * * *"
  # 정식 운영 DB가 홈서버에 있는 동안 대기 k3s 환경의 예약 백업은 실행하지 않는다.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: pg-backup
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            # dump(999)와 upload(1000)가 같은 emptyDir를 안전하게 공유한다.
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # 1단계: 덤프 생성
            - name: dump
              image: postgres:16 # StatefulSet 이미지와 동일 버전 유지
              command: ["sh", "-c"]
              args:
                # 대기 루프 이유는 readonly-role-job.yaml 참고 — NetworkPolicy 가 새 파드 IP 를
                # 허용 목록에 넣기까지 몇 초 걸린다. 지금까지는 이미지 풀 시간이 그 창을 가려줬을 뿐이다.
                - |
                  set -eu
                  database_ready=false
                  for i in $(seq 1 40); do
                    if pg_isready -q; then
                      database_ready=true
                      break
                    fi
                    sleep 3
                  done
                  test "$database_ready" = true
                  backup_file="/backup/taple-$(date +%Y%m%d-%H%M%S).dump"
                  pg_dump -Fc -f "$backup_file"
                  test -s "$backup_file"
                  sha256sum "$backup_file" >"$backup_file.sha256"
                  sha256sum -c "$backup_file.sha256"
                  ls -lh /backup
              env:
                - name: PGHOST
                  value: postgres.db.svc.cluster.local
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef: { name: postgres-secrets, key: POSTGRES_DB }
              securityContext:
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: 500m, memory: 512Mi }
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            # 2단계: 노드와 다른 장애 영역의 S3 호환 스토리지로 업로드
            - name: upload
              image: amazon/aws-cli:2.22.35
              command: ["sh", "-c"]
              args:
                # TODO(Phase 9): 보존 정책(일 7 / 주 4) — 버킷 lifecycle 지원 확인, 미지원 시 여기서 오래된 키 삭제
                - |
                  set -eu
                  aws s3 cp /backup/ "s3://${S3_BUCKET}/pg-backup/" \
                    --recursive --endpoint-url "${S3_ENDPOINT}"
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                # Secrets Manager /tapple/prod/backup-s3 JSON → ExternalSecret/backup-s3
                # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / S3_ENDPOINT / S3_BUCKET
                - secretRef:
                    name: backup-s3
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 5Gi
            - name: tmp
              emptyDir: {}
