---
- name: Resolve the AWS bootstrap access key from variables or the controller environment
  ansible.builtin.set_fact:
    external_secrets_bootstrap_effective_access_key_id: >-
      {{ external_secrets_bootstrap_aws_access_key_id
         if external_secrets_bootstrap_aws_access_key_id | length > 0
         else lookup('ansible.builtin.env', 'ESO_AWS_ACCESS_KEY_ID') }}
    external_secrets_bootstrap_effective_secret_access_key: >-
      {{ external_secrets_bootstrap_aws_secret_access_key
         if external_secrets_bootstrap_aws_secret_access_key | length > 0
         else lookup('ansible.builtin.env', 'ESO_AWS_SECRET_ACCESS_KEY') }}
  no_log: true

- name: Prompt for the AWS bootstrap access key ID when absent
  ansible.builtin.pause:
    prompt: ESO AWS access key ID
    echo: false
  register: external_secrets_bootstrap_access_key_prompt
  when: external_secrets_bootstrap_effective_access_key_id | length == 0
  no_log: true
  become: false

- name: Prompt for the AWS bootstrap secret access key when absent
  ansible.builtin.pause:
    prompt: ESO AWS secret access key
    echo: false
  register: external_secrets_bootstrap_secret_key_prompt
  when: external_secrets_bootstrap_effective_secret_access_key | length == 0
  no_log: true
  become: false

- name: Merge any prompted AWS bootstrap values
  ansible.builtin.set_fact:
    external_secrets_bootstrap_effective_access_key_id: >-
      {{ external_secrets_bootstrap_effective_access_key_id
         if external_secrets_bootstrap_effective_access_key_id | length > 0
         else external_secrets_bootstrap_access_key_prompt.user_input }}
    external_secrets_bootstrap_effective_secret_access_key: >-
      {{ external_secrets_bootstrap_effective_secret_access_key
         if external_secrets_bootstrap_effective_secret_access_key | length > 0
         else external_secrets_bootstrap_secret_key_prompt.user_input }}
  no_log: true

- name: Reject empty AWS bootstrap credentials
  ansible.builtin.assert:
    that:
      - external_secrets_bootstrap_effective_access_key_id | length > 0
      - external_secrets_bootstrap_effective_secret_access_key | length > 0
    fail_msg: AWS bootstrap credentials cannot be empty.
  no_log: true

- name: Ensure the External Secrets namespace exists
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - apply
      - --field-manager=tapple-bootstrap
      - -f
      - '-'
    stdin: >-
      {{ {'apiVersion': 'v1', 'kind': 'Namespace',
          'metadata': {'name': external_secrets_bootstrap_namespace}} | to_json }}
  register: external_secrets_bootstrap_namespace_apply
  changed_when: "'created' in external_secrets_bootstrap_namespace_apply.stdout"

- name: Check whether the External Secrets controller already exists
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - deployment/external-secrets
      - -n
      - "{{ external_secrets_bootstrap_namespace }}"
  register: external_secrets_bootstrap_controller
  changed_when: false
  failed_when: false

- name: Compare the AWS bootstrap Secret without exposing its data
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - diff
      - --server-side=true
      - --force-conflicts
      - --field-manager=tapple-bootstrap
      - -n
      - "{{ external_secrets_bootstrap_namespace }}"
      - -f
      - '-'
    stdin: "{{ external_secrets_bootstrap_definition | to_json }}"
  vars:
    external_secrets_bootstrap_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ external_secrets_bootstrap_secret_name }}"
        namespace: "{{ external_secrets_bootstrap_namespace }}"
        labels:
          app.kubernetes.io/managed-by: operator-bootstrap
          tapple.io/secret-purpose: external-secrets-aws-auth
      type: Opaque
      stringData:
        access-key-id: "{{ external_secrets_bootstrap_effective_access_key_id }}"
        secret-access-key: "{{ external_secrets_bootstrap_effective_secret_access_key }}"
  register: external_secrets_bootstrap_diff
  changed_when: false
  failed_when: external_secrets_bootstrap_diff.rc not in [0, 1]
  no_log: true

- name: Reconcile the AWS bootstrap Secret when it differs
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - apply
      - --server-side=true
      - --force-conflicts
      - --field-manager=tapple-bootstrap
      - -n
      - "{{ external_secrets_bootstrap_namespace }}"
      - -f
      - '-'
    stdin: "{{ external_secrets_bootstrap_definition | to_json }}"
  vars:
    external_secrets_bootstrap_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ external_secrets_bootstrap_secret_name }}"
        namespace: "{{ external_secrets_bootstrap_namespace }}"
        labels:
          app.kubernetes.io/managed-by: operator-bootstrap
          tapple.io/secret-purpose: external-secrets-aws-auth
      type: Opaque
      stringData:
        access-key-id: "{{ external_secrets_bootstrap_effective_access_key_id }}"
        secret-access-key: "{{ external_secrets_bootstrap_effective_secret_access_key }}"
  when: external_secrets_bootstrap_diff.rc == 1
  changed_when: true
  no_log: true
  notify: Restart External Secrets after AWS credential rotation

- name: Remove AWS bootstrap values from in-memory host variables
  ansible.builtin.set_fact:
    external_secrets_bootstrap_effective_access_key_id: ''
    external_secrets_bootstrap_effective_secret_access_key: ''
    external_secrets_bootstrap_access_key_prompt: {}
    external_secrets_bootstrap_secret_key_prompt: {}
  no_log: true
