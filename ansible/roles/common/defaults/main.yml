---
common_tapple_timezone: Asia/Seoul

common_packages:
  - ca-certificates
  - curl
  - ufw

common_admin_ssh_cidrs: []
# 팀원 kubeconfig/port-forward가 필요할 때만 고정 egress 또는 VPN CIDR를 넣는다.
# 빈 목록이면 Kubernetes API 6443은 외부에서 접근할 수 없다.
common_k3s_api_cidrs: []
# bootstrap.yml의 로컬 preflight와 호환되는 고정 계약이다. common 역할은 이 값이
# 정확히 [443]인지 다시 확인하고, 실제 443 rule은 Cloudflare origin CIDR에만 연다.
common_public_tcp_ports:
  - 443
