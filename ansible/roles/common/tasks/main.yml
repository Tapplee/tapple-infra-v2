---
- name: Require the supported Ubuntu host family
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_major_version in ['22', '24']
      - ansible_facts.architecture in ['x86_64', 'amd64']
    fail_msg: This bootstrap supports only x86_64 Ubuntu 22.04 or 24.04 hosts.

- name: Require the Cloudflare-only public port contract before host mutation
  ansible.builtin.assert:
    that:
      - common_public_tcp_ports == [443]
      - common_cloudflare_origin_ipv4_cidrs | length == 15
      - common_cloudflare_origin_ipv6_cidrs | length == 7
      - >-
        ((common_cloudflare_origin_ipv4_cidrs
        + common_cloudflare_origin_ipv6_cidrs) | unique | length)
        == ((common_cloudflare_origin_ipv4_cidrs
        + common_cloudflare_origin_ipv6_cidrs) | length)
    fail_msg: >-
      The origin firewall is fail-closed: port 80 and generic public ports are
      forbidden, and 443 must use the reviewed Cloudflare IPv4/IPv6 ranges.
  delegate_to: localhost
  become: false
  tags:
    - preflight

- name: Validate the pinned Cloudflare origin CIDRs before host mutation
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import ipaddress
        import sys

        raw = sys.argv[1]
        expected_version = int(sys.argv[2])
        try:
            network = ipaddress.ip_network(raw, strict=True)
        except ValueError as error:
            raise SystemExit(f"invalid Cloudflare CIDR {raw!r}: {error}") from error
        if network.version != expected_version:
            raise SystemExit(
                f"Cloudflare CIDR {raw!r} is not IPv{expected_version}"
            )
        if network.prefixlen == 0 or not network.is_global:
            raise SystemExit(f"unsafe Cloudflare CIDR: {raw!r}")
        if raw != network.with_prefixlen:
            raise SystemExit(
                f"Cloudflare CIDR must be canonical: {raw!r}; "
                f"use {network.with_prefixlen!r}"
            )
      - "{{ item }}"
      - "{{ 6 if ':' in item else 4 }}"
  loop: >-
    {{ common_cloudflare_origin_ipv4_cidrs
       + common_cloudflare_origin_ipv6_cidrs }}
  changed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  tags:
    - preflight

- name: Install host prerequisites
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Link the host timezone data
  ansible.builtin.file:
    path: /etc/localtime
    src: "/usr/share/zoneinfo/{{ common_tapple_timezone }}"
    state: link
    force: true
    owner: root
    group: root

- name: Persist the host timezone name
  ansible.builtin.copy:
    content: "{{ common_tapple_timezone }}\n"
    dest: /etc/timezone
    owner: root
    group: root
    mode: '0644'

- name: Inspect active swap devices
  ansible.builtin.command: swapon --show --noheadings
  register: common_active_swap
  changed_when: false

- name: Disable active swap
  ansible.builtin.command: swapoff --all
  when: common_active_swap.stdout | trim | length > 0
  changed_when: true

- name: Disable swap entries at boot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\n]+\s+[^#\n]+\s+swap\s+.*)$'
    replace: '# \1'

- name: Load Kubernetes kernel modules at boot
  ansible.builtin.template:
    src: k3s-modules.conf.j2
    dest: /etc/modules-load.d/k3s.conf
    owner: root
    group: root
    mode: '0644'

- name: Load Kubernetes kernel modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Configure Kubernetes kernel parameters
  ansible.builtin.template:
    src: k3s-sysctl.conf.j2
    dest: /etc/sysctl.d/90-k3s.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply Kubernetes kernel parameters

- name: Initialize the desired administrator and Kubernetes API firewall rules
  ansible.builtin.set_fact:
    common_expected_admin_ssh_ufw_rules: []
    common_expected_k3s_api_ufw_rules: []
    common_expected_cloudflare_https_ufw_rules: []
    common_expected_internal_ufw_rules: []

- name: Build the desired administrator SSH firewall rules
  ansible.builtin.set_fact:
    common_expected_admin_ssh_ufw_rules: >-
      {{ common_expected_admin_ssh_ufw_rules
         + ['ufw allow from '
            ~ (item | regex_replace('/32$', '') | regex_replace('/128$', ''))
            ~ ' to any port 22 proto tcp'] }}
  loop: "{{ common_admin_ssh_cidrs }}"

- name: Build the desired Kubernetes API firewall rules
  ansible.builtin.set_fact:
    common_expected_k3s_api_ufw_rules: >-
      {{ common_expected_k3s_api_ufw_rules
         + ['ufw allow from '
            ~ (item | regex_replace('/32$', '') | regex_replace('/128$', ''))
            ~ ' to any port 6443 proto tcp'] }}
  loop: "{{ common_k3s_api_cidrs }}"

- name: Build the desired Cloudflare HTTPS firewall rules
  ansible.builtin.set_fact:
    common_expected_cloudflare_https_ufw_rules: >-
      {{ common_expected_cloudflare_https_ufw_rules
         + ['ufw allow from '
            ~ (item | regex_replace('/32$', '') | regex_replace('/128$', ''))
            ~ ' to any port 443 proto tcp'] }}
  loop: >-
    {{ common_cloudflare_origin_ipv4_cidrs
       + common_cloudflare_origin_ipv6_cidrs }}

- name: Build the desired K3s internal firewall rules
  ansible.builtin.set_fact:
    common_expected_internal_ufw_rules: >-
      {{ common_expected_internal_ufw_rules
         + ['ufw allow from '
            ~ (item | regex_replace('/32$', '') | regex_replace('/128$', ''))] }}
  loop:
    - "{{ k3s_cluster_cidr }}"
    - "{{ k3s_service_cidr }}"

- name: Combine the desired inbound UFW allow rules
  ansible.builtin.set_fact:
    common_expected_inbound_ufw_rules: >-
      {{ common_expected_admin_ssh_ufw_rules
         + common_expected_k3s_api_ufw_rules
         + common_expected_cloudflare_https_ufw_rules
         + common_expected_internal_ufw_rules }}

- name: Read configured UFW rules before any firewall mutation
  ansible.builtin.command: ufw show added
  register: common_configured_ufw_rules_initial
  changed_when: false

- name: Refuse unmanaged firewall rules that can override the declared state
  ansible.builtin.assert:
    that:
      - >-
        common_configured_ufw_rules_initial.stdout_lines
        | select('match', '^ufw\s+route\s+(?:allow|limit)(?:\s|$)')
        | list | length == 0
      - >-
        common_configured_ufw_rules_initial.stdout_lines
        | select('match', '^ufw\s+(?:deny|reject)(?:\s|$)')
        | reject('search', '(^|\s)out(\s|$)')
        | list | length == 0
      - >-
        common_configured_ufw_rules_initial.stdout_lines
        | select('match', '^ufw\s+(?:allow|limit)(?:\s|$)')
        | reject('search', '(^|\s)out(\s|$)')
        | map('regex_replace', '\s+comment\s+.*$', '')
        | select('search', '[\x27\x22]')
        | list | length == 0
    fail_msg: >-
      Found an unmanaged forwarded allow/limit rule or inbound deny/reject
      rule, or a quoted application-profile rule that cannot be reconciled
      safely. Resolve it through the IDC console or model it explicitly before
      rerunning; an earlier deny can override the administrator SSH allowlist.

- name: Allow SSH only from administrator networks
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - from
      - "{{ item }}"
      - to
      - any
      - port
      - '22'
      - proto
      - tcp
      - comment
      - tapple-admin-ssh
  loop: "{{ common_admin_ssh_cidrs }}"
  register: common_ssh_ufw_rules
  changed_when: "'Rule added' in common_ssh_ufw_rules.stdout"

- name: Allow the Kubernetes API only from approved infra or VPN networks
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - from
      - "{{ item }}"
      - to
      - any
      - port
      - '6443'
      - proto
      - tcp
      - comment
      - tapple-k3s-api
  loop: "{{ common_k3s_api_cidrs }}"
  register: common_k3s_api_ufw_rules
  changed_when: "'Rule added' in common_k3s_api_ufw_rules.stdout"

- name: Allow origin HTTPS only from Cloudflare networks
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - from
      - "{{ item }}"
      - to
      - any
      - port
      - '443'
      - proto
      - tcp
      - comment
      - tapple-cloudflare-https
  loop: >-
    {{ common_cloudflare_origin_ipv4_cidrs
       + common_cloudflare_origin_ipv6_cidrs }}
  register: common_cloudflare_https_ufw_rules
  changed_when: "'Rule added' in common_cloudflare_https_ufw_rules.stdout"

- name: Allow the K3s pod and service networks on the node
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - from
      - "{{ item }}"
      - to
      - any
      - comment
      - k3s-internal
  loop:
    - "{{ k3s_cluster_cidr }}"
    - "{{ k3s_service_cidr }}"
  register: common_internal_ufw_rules
  changed_when: "'Rule added' in common_internal_ufw_rules.stdout"

- name: Read configured UFW rules after adding the desired inbound rules
  ansible.builtin.command: ufw show added
  register: common_configured_ufw_rules_before_cleanup
  changed_when: false

- name: Remove inbound UFW allow rules outside the declared state
  ansible.builtin.command:
    argv: >-
      {{ ['ufw', '--force', 'delete']
         + (item | regex_replace('^ufw\\s+', '')).split() }}
  loop: >-
    {{ common_configured_ufw_rules_before_cleanup.stdout_lines
       | select('match', '^ufw\\s+(?:allow|limit)(?:\\s|$)')
       | reject('search', '(^|\\s)out(\\s|$)')
       | map('regex_replace', '\\s+comment\\s+.*$', '')
       | list }}
  when: item not in common_expected_inbound_ufw_rules
  changed_when: true

- name: Read the reconciled UFW rules
  ansible.builtin.command: ufw show added
  register: common_configured_ufw_rules_after
  changed_when: false

- name: Verify the declared inbound UFW allow rules
  ansible.builtin.assert:
    that:
      - >-
        (common_configured_ufw_rules_after.stdout_lines
        | select('match', '^ufw\\s+(?:allow|limit)(?:\\s|$)')
        | reject('search', '(^|\\s)out(\\s|$)')
        | map('regex_replace', '\\s+comment\\s+.*$', '')
        | list | difference(common_expected_inbound_ufw_rules) | length) == 0
      - >-
        (common_expected_inbound_ufw_rules
        | difference(common_configured_ufw_rules_after.stdout_lines
          | select('match', '^ufw\\s+(?:allow|limit)(?:\\s|$)')
          | reject('search', '(^|\\s)out(\\s|$)')
          | map('regex_replace', '\\s+comment\\s+.*$', '')
          | list) | length) == 0
    fail_msg: >-
      UFW inbound allow rules differ from the Ansible-declared firewall state.

- name: Inspect the effective UFW defaults
  ansible.builtin.command: ufw status verbose
  register: common_ufw_defaults
  changed_when: false

- name: Deny incoming traffic by default
  ansible.builtin.command: ufw default deny incoming
  when: "'deny (incoming)' not in common_ufw_defaults.stdout"
  changed_when: true

- name: Allow outgoing traffic by default
  ansible.builtin.command: ufw default allow outgoing
  when: "'allow (outgoing)' not in common_ufw_defaults.stdout"
  changed_when: true

- name: Inspect UFW state
  ansible.builtin.command: ufw status
  register: common_ufw_status
  changed_when: false

- name: Enable UFW after the SSH allowlist exists
  ansible.builtin.command: ufw --force enable
  when: "'Status: inactive' in common_ufw_status.stdout"
  changed_when: true

- name: Read the effective UFW rules
  ansible.builtin.command: ufw status verbose
  register: common_effective_ufw_status
  changed_when: false

- name: Verify the required K3s firewall boundaries
  ansible.builtin.assert:
    that:
      - "'Status: active' in common_effective_ufw_status.stdout"
      - "'deny (incoming)' in common_effective_ufw_status.stdout"
      - "'allow (outgoing)' in common_effective_ufw_status.stdout"
      - k3s_cluster_cidr in common_effective_ufw_status.stdout
      - k3s_service_cidr in common_effective_ufw_status.stdout
      - >-
        common_effective_ufw_status.stdout_lines
        | select('match', '^22(?:/tcp)?(?: \\(v6\\))?\\s+(?:ALLOW|LIMIT)(?: IN)?\\s+Anywhere')
        | list | length == 0
      - >-
        common_effective_ufw_status.stdout_lines
        | select('match', '^6443(?:/tcp)?(?: \\(v6\\))?\\s+(?:ALLOW|LIMIT)(?: IN)?\\s+Anywhere')
        | list | length == 0
      - >-
        common_effective_ufw_status.stdout_lines
        | select('match', '^80(?:/tcp)?(?: \\(v6\\))?\\s+(?:ALLOW|LIMIT)(?: IN)?\\s+Anywhere')
        | list | length == 0
      - >-
        common_effective_ufw_status.stdout_lines
        | select('match', '^443(?:/tcp)?(?: \\(v6\\))?\\s+(?:ALLOW|LIMIT)(?: IN)?\\s+Anywhere')
        | list | length == 0
    fail_msg: >-
      UFW must be active, allow both internal K3s CIDRs, and never expose SSH
      Kubernetes API, HTTP, or HTTPS to Anywhere. Origin HTTPS must use only the
      pinned Cloudflare CIDRs.

- name: Verify every administrator SSH network is allowed
  ansible.builtin.assert:
    that:
      - >-
        (item | regex_replace('/32$', '') | regex_replace('/128$', ''))
        in common_effective_ufw_status.stdout
  loop: "{{ common_admin_ssh_cidrs }}"

- name: Verify every approved Kubernetes API network is allowed
  ansible.builtin.assert:
    that:
      - >-
        (item | regex_replace('/32$', '') | regex_replace('/128$', ''))
        in common_effective_ufw_status.stdout
  loop: "{{ common_k3s_api_cidrs }}"

- name: Verify every Cloudflare origin network is allowed
  ansible.builtin.assert:
    that:
      - >-
        (item | regex_replace('/32$', '') | regex_replace('/128$', ''))
        in common_effective_ufw_status.stdout
  loop: >-
    {{ common_cloudflare_origin_ipv4_cidrs
       + common_cloudflare_origin_ipv6_cidrs }}

- name: Ensure the OpenSSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Enforce key-only SSH authentication
  ansible.builtin.template:
    src: ssh-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-tapple-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Validate and reload SSH

- name: Check for cloud-init configuration
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: common_cloud_config_dir

- name: Prevent cloud-init from restoring SSH password login
  ansible.builtin.copy:
    content: "ssh_pwauth: false\n"
    dest: /etc/cloud/cloud.cfg.d/99-disable-pwauth.cfg
    owner: root
    group: root
    mode: '0644'
  when: common_cloud_config_dir.stat.isdir | default(false)

- name: Apply SSH hardening before reconnect validation
  ansible.builtin.meta: flush_handlers

- name: Reset the controller SSH connection after firewall reconciliation
  ansible.builtin.meta: reset_connection

- name: Verify a fresh SSH connection through the reconciled firewall
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    sleep: 2
    timeout: 60
