---
- name: Apply Kubernetes kernel parameters
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Validate the OpenSSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: Validate and reload SSH

- name: Reload OpenSSH
  ansible.builtin.service:
    name: ssh
    state: reloaded
  listen: Validate and reload SSH
